<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F2">
<title>Giappone 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giappone ’27">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E6%9D%B1%E4%BA%AC%E9%83%BD%E5%A4%A7%E9%98%AA%E5%A5%88%E8%89%AF%E3%83%9F%E3%83%A9%E3%83%8E%E6%97%A5%E6%9C%AC&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --ink:#1C2430; --muted:#5E6673; --line:#D8DCD9; --soft:#E9ECEA;
  --tokyo:#0A86B8; --kyoto:#8458B3; --osaka:#D97A00; --nara:#3F9441; --milano:#7E848D; --other:#A84E73;
  --alert:#C8202A; --alert-bg:#FCE8E8; --water:#C9E0EE; --park:#D3E5C9; --rail:#9EA6AE; --land:#EEF0EC; --road:#FFFFFF; --hill:#E1E4DC; --decide:#8A5300; --decide-bg:#FFF1D6; --ok:#2E7D32; --ok-bg:#E3F2E4;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --kanji:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1B2129; --ink:#E8ECEF; --muted:#9AA3AE; --line:#2E3640; --soft:#232A33;
    --tokyo:#3AB0E0; --kyoto:#AE88DA; --osaka:#F2A03A; --nara:#6CC36A; --milano:#A2A8B0; --other:#D97BA2;
    --alert:#FF6B6B; --alert-bg:#3A1F22; --water:#1C3546; --park:#22361F; --rail:#5A646F; --land:#20272F; --road:#2D3540; --hill:#262E36; --decide:#F2B85B; --decide-bg:#3A2E1A; --ok:#7FD283; --ok-bg:#1E3322;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B2129; --ink:#E8ECEF; --muted:#9AA3AE; --line:#2E3640; --soft:#232A33;
  --tokyo:#3AB0E0; --kyoto:#AE88DA; --osaka:#F2A03A; --nara:#6CC36A; --milano:#A2A8B0; --other:#D97BA2;
  --alert:#FF6B6B; --alert-bg:#3A1F22; --water:#1C3546; --park:#22361F; --rail:#5A646F; --land:#20272F; --road:#2D3540; --hill:#262E36; --decide:#F2B85B; --decide-bg:#3A2E1A; --ok:#7FD283; --ok-bg:#1E3322;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--tokyo);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 110px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--kanji);font-size:30px;line-height:1;letter-spacing:.02em}
.brand span{font-weight:700;font-size:18px}
.count{font-size:14px;color:var(--muted);text-align:right}
.count strong{display:block;color:var(--ink);font-size:20px;line-height:1.2}

/* route strip (the memorable thing) */
.route{position:relative;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:10px 18px 6px}
.route::-webkit-scrollbar{display:none}
.track{display:flex;gap:0;position:relative;width:max-content}
.stop{position:relative;width:54px;flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.stop::before{content:"";position:absolute;top:21px;left:0;right:0;height:6px;background:var(--c)}
.stop:first-child::before{left:50%}.stop:last-child::before{right:50%}
.badge{position:relative;z-index:1;width:42px;height:48px;border-radius:12px;background:var(--surface);border:4px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
.badge i{font-style:normal;font-weight:700;font-size:11px;color:var(--c)}
.badge em{font-style:normal;font-weight:700;font-size:16px}
.stop small{font-size:11px;color:var(--muted)}
.stop[aria-current="true"] .badge{background:var(--c);transform:scale(1.12)}
.stop[aria-current="true"] .badge i,.stop[aria-current="true"] .badge em{color:#fff}
.stop.today small{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:6px 0 4px}
.legend span::before{content:"";display:inline-block;width:14px;height:5px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:middle}

/* day panel */
.day{margin-top:14px;background:var(--surface);border-radius:20px;padding:22px 20px 20px;border-top:8px solid var(--c);position:relative;overflow:hidden}
.day-head{display:block}
.day-head h2{margin:0;font-size:26px;line-height:1.2}
.day-head p{margin:4px 0 0;color:var(--muted);font-size:15px}
.kanji{font-family:var(--kanji);font-weight:800;font-size:56px;line-height:1;color:var(--c);display:flex;flex-direction:column;align-items:center;float:right;margin:-6px -6px 8px 14px}
.kanji.k3{font-size:38px}
.note,.sleep,.pager,.daymap{clear:both}
.slots{list-style:none;margin:18px 0 0;padding:0}
.slots li{position:relative;padding:0 0 16px 28px}
.slots li::before{content:"";position:absolute;left:6px;top:8px;width:12px;height:12px;border-radius:50%;border:3px solid var(--c);background:var(--surface)}
.slots li::after{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.slots li:last-child::after{display:none}
.slots h3{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.slots p{margin:2px 0 0;font-size:17px}
.note{margin:6px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.note.alert{background:var(--alert-bg);color:var(--alert);font-weight:700}
.note.decide{background:var(--decide-bg);color:var(--decide);font-weight:700}
.sleep{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.sleep b{color:var(--ink)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.pager .btn{justify-content:center}.pager .solid{grid-column:1/-1;grid-row:2}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.4;cursor:default}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* places */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 6px}
.filters{padding:6px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--c,var(--line));background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;flex:1 1 260px}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:9px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1 1 160px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:15px}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.stat{font-size:14px;color:var(--muted);margin:4px 0 10px}
.plist{list-style:none;margin:0;padding:0}
.place{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.place.done .pname{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin-top:2px;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.place.done .tick{background:var(--c)}
.place.done .tick svg{opacity:1}
.pname{font-weight:700;font-size:17px;margin:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:12px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--c)}
.cityname{color:var(--c);font-weight:700}
.newtag{color:var(--other);font-weight:700}
.place details{grid-column:2}
.place summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
.place summary::-webkit-details-marker{display:none}
.place summary::before{content:"+ ";font-weight:700}
.place details[open] summary::before{content:"− "}
.place details p{margin:6px 0 8px;font-size:15px}
.empty{padding:30px 0;color:var(--muted);text-align:center}

/* money */
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 18px}
.big div{background:var(--surface);border-radius:16px;padding:16px}
.big small{display:block;color:var(--muted);font-size:13px}
.big strong{font-size:26px;line-height:1.2}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;white-space:nowrap}
#btable td,#btable th{font-size:14px}
#btable td .pill{margin-top:3px}
#btable tr.paid td{color:var(--muted)}
#btable td.due,#btable th.due,thead th.due{font-weight:700;color:var(--ink)}
#btable tr.paid td.due{color:var(--ok);font-weight:500}
.big small.sub{margin-top:6px;font-size:12.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.Saldato{background:var(--ok-bg);color:var(--ok)}
.pill.Prenotato{background:var(--soft);color:var(--tokyo)}
.pill.Da{background:var(--alert-bg);color:var(--alert)}
.tablewrap{overflow-x:auto}
.conv{background:var(--surface);border-radius:16px;padding:16px;margin:18px 0}
.conv h2{margin:0 0 10px;font-size:18px}
.convrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.convrow label{font-size:13px;color:var(--muted);display:block}
.convrow input{width:100%;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.eq{padding-bottom:12px;color:var(--muted)}
.rate{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.rate input{width:80px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}

/* info */
section h2.sec{font-size:20px;margin:26px 0 8px}
.stays{list-style:none;margin:0;padding:0}
.stays li{display:grid;grid-template-columns:8px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.stays li::before{content:"";width:8px;height:100%;min-height:36px;border-radius:4px;background:var(--c)}
.stays b{display:block}
.stays small{color:var(--muted);font-size:14px}
.tips{margin:0;padding-left:20px}
.tips li{margin:0 0 10px}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:0}
.phr div{padding:10px 0;border-bottom:1px solid var(--line)}
.phr div:nth-child(odd){font-weight:700;padding-right:10px}
.sos{display:flex;gap:10px;flex-wrap:wrap}
.sos a{flex:1 1 140px;text-decoration:none;background:var(--alert-bg);color:var(--alert);border-radius:14px;padding:12px 14px;font-weight:700}
.sos a span{display:block;font-size:26px;line-height:1.1}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--muted);font-size:13px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;text-decoration:none;font-size:13px;color:var(--muted)}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs a[aria-current="page"] svg{stroke:var(--alert)}

/* flight countdown */
.flight{margin:2px 0 14px}
.fl-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.fl-ends b{color:var(--ink);font-weight:700}
.fl-track{position:relative;height:28px}
.fl-track::before{content:"";position:absolute;left:0;right:0;top:13px;border-top:2px dashed var(--line)}
.fl-fill{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--alert);width:0}
.fl-plane{position:absolute;top:0;width:28px;height:28px;margin-left:-14px;left:0;color:var(--ink)}
.fl-dot{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;border:3px solid var(--alert);background:var(--bg)}
.fl-dot.a{left:-2px}.fl-dot.b{right:-2px;background:var(--alert)}
.fl-label{margin:6px 0 0;font-size:14px;color:var(--muted)}
.fl-label strong{color:var(--ink)}
.animate .fl-fill,.animate .fl-plane{transition:width 1.4s cubic-bezier(.2,.7,.2,1),left 1.4s cubic-bezier(.2,.7,.2,1)}

/* maps */
.mapcard{background:var(--surface);border-radius:20px;padding:12px 12px 14px;margin:8px 0 6px}
.mapcard svg{display:block;width:100%;height:auto;border-radius:12px;touch-action:manipulation}
.land{fill:var(--land)}.land2{fill:var(--land)}
.water{fill:var(--water)}.park{fill:var(--park)}.hill{fill:var(--hill)}
.river.s{stroke-width:5}
.road{fill:none;stroke:var(--road);stroke-width:4;stroke-linecap:round}
.road.s{stroke-width:2.2}
.tie{fill:none;stroke:var(--land);stroke-width:1.2;stroke-dasharray:4 5}
.rail.loop+.tie{stroke-width:1.6}
.sub{fill:none;stroke:var(--rail);stroke-width:2;stroke-dasharray:1.5 3;stroke-linecap:round}
.stn rect{fill:var(--land);stroke:var(--rail);stroke-width:1.8}
.stn text{font-size:9.5px;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:3px}
.dist{font-size:10px;fill:var(--muted);opacity:.55;letter-spacing:.08em;font-weight:500}
.wlbl{font-size:9.5px;fill:var(--muted);font-style:italic;opacity:.85}
.ht rect{fill:var(--ink);stroke:var(--land);stroke-width:2}
.ht .hh{fill:var(--land);font-size:11px;font-weight:700;text-anchor:middle}
.ht .hn{font-size:11.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.scale path{stroke:var(--muted);stroke-width:1.5;fill:none}.scale text{font-size:9.5px;fill:var(--muted)}
.north path{fill:var(--muted)}.north text{font-size:9px;fill:var(--muted);font-weight:700}
.river{fill:none;stroke:var(--water);stroke-width:9;stroke-linecap:round}
.rail{fill:none;stroke:var(--rail);stroke-width:3.2}
.rail.loop{stroke-width:4.5}
.grid{stroke:var(--line);stroke-width:1;fill:none}
.maplbl{font-size:10px;fill:var(--muted);font-style:italic}
.lm rect{fill:var(--land);stroke:var(--ink);stroke-width:2.5}
.lm text,.edge text{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.edge path{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge.on text{fill:var(--ink);font-weight:700}
.rt{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
.rt.faint{stroke-width:3;opacity:.28}
.rt.all{stroke-width:4;opacity:.7}
.rt.case{stroke:var(--land);stroke-width:12;opacity:1}
.rt.focus{stroke-width:6.5}
.rt.opt{stroke-dasharray:7 7}
.rt.draw{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) both}
.rt.draw.opt{animation:none;stroke-dasharray:7 7}
.rt.fly{stroke-dasharray:1 7;stroke-width:3.5}.rt.focus.fly{stroke-width:4.5}.rt.all.fly{opacity:.7}
.coast{stroke:var(--rail);stroke-width:.8;stroke-opacity:.5}
.fuji{fill:var(--muted);opacity:.55}.fujicap{fill:var(--land)}
.lm.tri text{font-size:11px;fill:var(--muted);font-style:italic}.lm.tri.on text{fill:var(--ink);font-weight:700;font-style:normal}
.st.city circle.m{fill:var(--c);stroke:var(--land);stroke-width:2.5}
.st.city .n{font-size:13.5px}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.st{cursor:pointer;outline:none}
.st circle.m{fill:var(--land);stroke:var(--ink);stroke-width:3}
.st.route circle.m{stroke:var(--c);stroke-width:4}
.st.hot circle.m{stroke:var(--ink);stroke-width:4.5}
.st.off circle.m{stroke:var(--muted);stroke-width:2;stroke-dasharray:2 2}
.st.opt circle.m{stroke:var(--c);stroke-dasharray:3 2}
.st circle.ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.st.sel circle.ring,.st:focus-visible circle.ring{opacity:1}
.st .n{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4.5px;stroke-linejoin:round;pointer-events:none}
.st.off .n,.st.dim .n{fill:var(--muted);font-weight:500}
.st .chk{fill:var(--ok);stroke:var(--surface);stroke-width:2}
.dnum rect{fill:var(--c)}.dnum text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle}
.daymap{margin:16px -8px 4px;border-radius:14px;overflow:hidden}
.daymap svg{display:block;width:100%;height:auto}
.daypick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0 0;padding-bottom:2px}
.daypick::-webkit-scrollbar{display:none}
.daypick button{flex:0 0 auto;border:2px solid var(--c);background:var(--surface);color:var(--ink);border-radius:9px;padding:3px 9px;font-size:13px;font-weight:700;cursor:pointer}
.daypick button[aria-pressed="true"]{background:var(--c);color:#fff}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.maplegend i{display:inline-block;width:20px;height:0;border-top:5px solid var(--c);border-radius:3px;vertical-align:3px;margin-right:6px}
.maplegend i.o{border-top-style:dashed;border-top-width:4px}
.maplegend i.x{width:10px;height:10px;border:2px dashed var(--muted);border-radius:50%;vertical-align:-1px}
.zinfo{margin:10px 2px 0;font-size:15px}
.zinfo h3{margin:0;font-size:18px}
.zinfo p{margin:2px 0 8px;color:var(--muted);font-size:14px}
.zbtns{display:flex;flex-wrap:wrap;gap:8px}
.zbtns .btn{padding:7px 13px;font-size:14px}
.ht.dim{opacity:.35}
.ht.hot rect{fill:var(--c)}
.hring{fill:none;stroke:var(--c);stroke-width:3;opacity:.55}
/* hotel */
.hcard{background:var(--surface);border-radius:20px;margin:0 0 16px;overflow:hidden;border-top:8px solid var(--c)}
.hcard .hbody{padding:18px 18px 16px}
.hcard h2{margin:0;font-size:22px;line-height:1.25}
.hmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 0;font-size:14px;color:var(--muted)}
.hmeta b{color:var(--c)}
.hc
